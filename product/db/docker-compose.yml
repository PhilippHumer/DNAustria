services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnaustria
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pass
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  ldap:
    image: rroemhild/test-openldap:latest
    container_name: dnaustria-ldap
    restart: unless-stopped
    user: "0:0"
    ports:
      - "389:10389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://127.0.0.1:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ldap-seed:
    image: rroemhild/test-openldap:latest
    container_name: dnaustria-ldap-seed
    depends_on:
      ldap:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        ldapadd -c -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -f /seed/01-users.ldif || true
        ldapsearch -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -b 'ou=people,dc=planetexpress,dc=com' '(uid=developer)' dn \
        | grep -q 'uid=developer,ou=people,dc=planetexpress,dc=com'
        ldapsearch -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -b 'ou=people,dc=planetexpress,dc=com' '(uid=admin)' dn \
        | grep -q 'uid=admin,ou=people,dc=planetexpress,dc=com'
    volumes:
      - ./ldap-seed:/seed:ro

  # Optional LDAP web UI
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: dnaustria-phpldapadmin
    restart: unless-stopped
    depends_on:
      ldap:
        condition: service_started
      ldap-seed:
        condition: service_completed_successfully
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"

volumes:
  pgdata:
  pgadmin_data:
