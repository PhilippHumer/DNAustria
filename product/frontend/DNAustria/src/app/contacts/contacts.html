<main class="flex-grow-1 p-4 p-md-5">
  <div class="d-flex flex-column gap-4 w-100">

    <!-- Header: title + button -->
    <div
      class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3 w-100 align-self-stretch"
    >
      <div>
        <h1 class="h3 fw-bold mb-1">Contacts</h1>
        <p class="text-muted mb-0">Manage event contacts</p>
      </div>

      <button
        type="button"
        class="btn btn-primary d-inline-flex align-items-center gap-2 ms-sm-auto"
        (click)="openCreatePopup()"
      >
        <i class="bi bi-plus-lg"></i>
        <span>Add Contact</span>
      </button>
    </div>

    <!-- Contacts grid -->
    <div class="row g-4">
      @for (contact of contacts(); track contact.id ?? $index) {
        <app-contactcard
          [contact]="contact"
          class="col-12 col-md-6 col-lg-4"
          (editClicked)="openEditPopup(contact)"
          (deleteClicked)="openDeletePopup(contact)"
        ></app-contactcard>
      }
    </div>
  </div>
</main>

@if (isCreatePopupOpen()) {
  <app-contact-create-popup
    [editContact]="editingContact()"
    (cancel)="closeCreatePopup()"
    (saved)="handleContactSaved()"
  ></app-contact-create-popup>
}

@if (contactToDelete()) {
  <app-confirm-delete-popup
    [deleting]="deleteInProgress()"
    [error]="deleteError()"
    (confirm)="confirmDelete()"
    (cancel)="closeDeletePopup()"
  />
}
