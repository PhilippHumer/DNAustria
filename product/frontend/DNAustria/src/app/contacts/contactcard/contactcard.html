<div class="card h-100 shadow-sm border rounded-3">
    <div class="card-body pb-2">
      <div class="d-flex align-items-start justify-content-between gap-2">
        <h3 class="h5 fw-semibold mb-0">{{ contact().name || 'Unnamed Contact' }}</h3>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="onEditClick()"
            aria-label="Edit contact"
            title="Edit contact"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 style="width: .95rem; height: .95rem;">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="onDeleteClick()"
            aria-label="Delete contact"
            title="Delete contact"
          >
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 style="width: .95rem; height: .95rem;">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

  <div class="card-body pt-2 d-flex flex-column gap-3">

        <!-- Email -->
        <div class="d-flex align-items-center gap-3 small">
            <div class="p-2 rounded-3 bg-primary-subtle d-flex align-items-center justify-content-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="text-primary"
                    style="width: 1rem; height: 1rem;">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            </div>
            <a [href]="'mailto:' + (contact().email || '')"
                class="link-body-emphasis text-decoration-none text-truncate d-block flex-grow-1">
                {{ contact().email || '-' }}
            </a>
        </div>

        <!-- Phone -->
        <div class="d-flex align-items-center gap-3 small">
            <div class="p-2 rounded-3 bg-secondary-subtle d-flex align-items-center justify-content-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="text-secondary"
                    style="width: 1rem; height: 1rem;">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            </div>
            <a [href]="'tel:' + (contact().phone || '')"
                class="link-body-emphasis text-decoration-none text-truncate d-block flex-grow-1">
            {{ contact().phone || '-' }}
            </a>
        </div>

        <!-- Organization -->
        <div class="mt-3 pt-3 border-top d-flex align-items-center gap-3 small">
            <div class="p-2 rounded-3 bg-info-subtle d-flex align-items-center justify-content-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    class="text-info-emphasis"
                    style="width: 1rem; height: 1rem;">
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                <path d="M10 6h4"></path>
                <path d="M10 10h4"></path>
                <path d="M10 14h4"></path>
                <path d="M10 18h4"></path>
            </svg>
            </div>
            <span class="text-muted text-truncate d-block flex-grow-1">
            {{ contact().organization || '-' }}
            </span>
        </div>
  </div>
</div>
