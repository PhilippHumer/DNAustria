<div class="contact-popup-backdrop">
  <div class="contact-popup card shadow border-0">
    <div class="card-header bg-white border-bottom">
      <h2 class="h5 mb-1 fw-bold">{{ isEditMode() ? 'Edit Contact' : 'Add Contact' }}</h2>
      <p class="text-muted mb-0 small">
        {{ isEditMode() ? 'Update an existing contact' : 'Register a new event contact' }}
      </p>
    </div>

    <div class="card-body">
      <app-contact-form
        [editContact]="editContact()"
        [submitting]="submitting()"
        [submitError]="submitError()"
        [isEditMode]="isEditMode()"
        (formSubmit)="onFormSubmit($event)"
        (formCancel)="close()"
      />
    </div>
  </div>
</div>
