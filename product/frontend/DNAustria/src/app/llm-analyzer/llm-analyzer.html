<div class="llm-analyzer container p-3">
  <h2>LLM Analyzer</h2>
  <p>Enter text below and click "Analyze" to send it for LLM processing.</p>

  <div class="mb-2">
    <textarea #inputText rows="10" class="form-control" placeholder="Paste text here..."></textarea>
  </div>

  <div>
    <button class="btn btn-primary" (click)="analyze(inputText.value)" [disabled]="loading">Analyze</button>
  </div>

  <!-- Results placeholder -->
  <div class="mt-3">
    <h4>Results</h4>
    <div *ngIf="loading" class="alert alert-info">Analyzing…</div>
    <pre *ngIf="results" class="alert alert-light" style="white-space:pre-wrap;">{{results}}</pre>
    <div *ngIf="!results && !loading" class="alert alert-light">No results yet.</div>
  </div>
</div>
