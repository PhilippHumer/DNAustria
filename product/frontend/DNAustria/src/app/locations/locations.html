<main class="flex-grow-1 p-4 p-md-5">
  <div class="d-flex flex-column gap-4">

    <!-- Header: title + button -->
    <div
      class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-sm-between gap-3"
    >
      <div>
        <h1 class="h3 fw-bold mb-1">Locations</h1>
        <p class="text-muted mb-0">Manage event locations</p>
      </div>

      <button type="button" class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="openPopupMenu()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             style="width: 1rem; height: 1rem;">
          <path d="M5 12h14"></path>
          <path d="M12 5v14"></path>
        </svg>
        <span>add location</span>
      </button>
    </div>

    <!-- Organizations grid -->
    <div class="row row-cols-1 row-cols-md-2 g-4">
      @for(location of locations(); track location.id){
        <app-locationcard [location]="location" (deleteClicked)="openDeletePopup(location)" (editClicked)="openEditPopup(location)"></app-locationcard>
      }
    </div>

  </div>
</main>

@if(isCreatePopupOpen()){
  <app-create-location (cancel)="closePopupMenu()" (saved)="onLocationCreated()" [editLocation]="editingLocation()"></app-create-location>
}

@if (locationToDelete()) {
  <div class="delete-confirm-backdrop">
    <div class="delete-confirm card shadow border-0">
      <div class="card-body">
        <h2 class="h5 fw-bold mb-2">Confirm Delete</h2>
        <p class="mb-0">Do you really want to delete this entry?</p>
      </div>
      <div class="card-footer bg-white d-flex justify-content-end gap-2">
        @if (deleteError()) {
          <div class="text-danger small me-auto align-self-center">{{ deleteError() }}</div>
        }
        <button type="button" class="btn btn-outline-secondary" (click)="closeDeletePopup()" [disabled]="deleteInProgress()">
          Cancel
        </button>
        <button type="button" class="btn btn-danger" (click)="confirmDelete()" [disabled]="deleteInProgress()">
          @if (deleteInProgress()) {
            Deleting...
          } @else {
            Delete
          }
        </button>
      </div>
    </div>
  </div>
}
