<section class="login-page">
  <div class="login-panel shadow-lg">
    <div class="login-copy">
      <div class="login-logo-shell">
        <img src="assets/dnaustria-logo.png" alt="DNAustria logo" class="login-logo" />
      </div>
      <p class="login-eyebrow">Directory Access</p>
      <h1>Sign in to DNAustria</h1>
      <p class="text-body-secondary mb-0">
        Use your LDAP account to access the internal dashboard and management tools.
      </p>
    </div>

    <form class="login-form" (ngSubmit)="submit()">
      <div>
        <label class="form-label" for="username">Username</label>
        <input
          id="username"
          name="username"
          class="form-control form-control-lg"
          [(ngModel)]="username"
          autocomplete="username"
          [disabled]="submitting()"
        />
      </div>

      <div>
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-control form-control-lg"
          [(ngModel)]="password"
          autocomplete="current-password"
          [disabled]="submitting()"
        />
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger mb-0" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="submitting()">
        @if (submitting()) {
          Signing in...
        } @else {
          Sign in with LDAP
        }
      </button>
    </form>
  </div>
</section>
