<div class="card h-100 shadow-sm border rounded-3">
    <div class="card-body pb-2">
    <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
        <div class="d-flex flex-column gap-2">
          <a class="h6 fw-semibold mb-0 text-decoration-none link-body-emphasis" [routerLink]="['/event-details', event().id]">
            {{ event().name }}
          </a>
          <span class="badge border align-self-start" [class]="statusBadgeClass(event().status)">
            {{ statusLabel(event().status) }}
          </span>
        </div>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            (click)="onEditClick()"
            aria-label="Edit event"
            title="Edit event"
          >
            <i class="bi bi-pencil-square" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="onDeleteClick()"
            aria-label="Delete event"
            title="Delete event"
          >
            <i class="bi bi-trash3" aria-hidden="true"></i>
          </button>
        </div>
    </div>
    </div>

    <div class="card-body pt-0 d-flex flex-column gap-3">
    <p class="small text-muted mb-0">
        {{ descriptionPreview(event().description) }}
    </p>

    <div class="d-flex flex-column gap-2 small">
        <div class="d-flex align-items-center gap-2 text-muted">
        <i class="bi bi-calendar3" aria-hidden="true"></i>
        <span>{{ event().startDate | date:'mediumDate' }}</span>
        </div>

        <div class="d-flex align-items-center gap-2 text-muted">
        <i class="bi" [class.bi-globe2]="event().isOnline" [class.bi-geo-alt]="!event().isOnline" aria-hidden="true"></i>
        <span>{{ event().isOnline ? 'Online event' : 'On-site event' }}</span>
        </div>

        @if (event().link) {
        <a [href]="event().link" target="_blank" rel="noopener noreferrer" class="d-flex align-items-center gap-2 text-primary text-decoration-none">
        <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
        <span class="text-truncate">{{ event().link }}</span>
        </a>
        }
    </div>

    <div class="mt-3 pt-3 border-top">
        <p class="text-muted small mb-0">
        Program: {{ event().programName || 'Not specified' }}
        </p>
    </div>
    </div>
</div>
