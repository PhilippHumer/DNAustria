
<div class="card shadow-sm">
    <div class="card-body pb-2">
    <h3 class="h6 fw-semibold mb-0">Filter Events</h3>
    </div>
    <div class="card-body pt-0">
    <div class="d-flex flex-column flex-sm-row gap-3">
        <div class="position-relative flex-grow-1">
        <i
            class="bi bi-search text-muted position-absolute top-50 start-0 translate-middle-y ms-3"
            aria-hidden="true"
        ></i>
        <input
            type="text"
            class="form-control ps-5"
            placeholder="Search events..."
            [value]="searchTerm()"
            (input)="onSearchTermChange($event)"
        />
        </div>

        <div class="flex-grow-1 flex-sm-grow-0">
        <select class="form-select" [value]="status() ?? ''" (change)="onStatusChange($event)">
            <option value="">All statuses</option>
            @for (option of statusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
            }
        </select>
        </div>
    </div>
    </div>
</div>
