<!-- Sidebar -->
<aside class="app-sidebar">
  <!-- Header -->
  <div class="app-sidebar-header">
    <div class="d-flex align-items-center gap-3">
      <div class="app-sidebar-logo">
        <img src="assets/dnaustria-logo.png" alt="DNAustria logo" class="app-sidebar-logo-image" />
      </div>
      <div>
        <div class="app-sidebar-title">DNAustria</div>
        <div class="app-sidebar-subtitle">Discover and manage your DNA network</div>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="app-sidebar-nav">
    <div class="app-sidebar-group">
      <div class="px-3 pt-2 pb-3 border-bottom">
        <div class="fw-semibold text-truncate">{{ authService.displayName() }}</div>
        <div class="small text-body-secondary text-truncate">{{ authService.username() }}</div>
      </div>

      <div class="app-sidebar-group-label">Main Menu</div>
      <nav class="nav flex-column gap-1">

        <!-- Dashboard -->
        <a class="nav-link"
           routerLink="/dashboard"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1"></rect>
            <rect width="7" height="5" x="14" y="3" rx="1"></rect>
            <rect width="7" height="9" x="14" y="12" rx="1"></rect>
            <rect width="7" height="5" x="3" y="16" rx="1"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Events -->
        <a class="nav-link"
           routerLink="/events"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <path d="M3 10h18"></path>
          </svg>
          <span>Events</span>
        </a>

        <!-- Contacts -->
        <a class="nav-link"
           routerLink="/contacts"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Contacts</span>
        </a>

        <!-- Locations -->
        <a class="nav-link"
           routerLink="/locations"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Locations</span>
        </a>

        <!-- Organizations -->
        <a class="nav-link"
           routerLink="/organizations"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
            <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
            <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
            <path d="M10 6h4"></path>
            <path d="M10 10h4"></path>
            <path d="M10 14h4"></path>
            <path d="M10 18h4"></path>
          </svg>
          <span>Organizations</span>
        </a>

        <!-- Export -->
        <a class="nav-link"
           routerLink="/export"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" x2="12" y1="15" y2="3"></line>
          </svg>
          <span>Export</span>
        </a>

        <!-- LLM Analyzer -->
        <a class="nav-link"
           routerLink="/llm-analyzer"
           routerLinkActive="active">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v6"></path>
            <path d="M12 22v-6"></path>
            <circle cx="12" cy="12" r="9"></circle>
          </svg>
          <span>LLM Analyzer</span>
        </a>
      </nav>
    </div>
  </div>

  <div class="p-3 border-top">
    <button type="button" class="btn btn-outline-secondary w-100" (click)="logout()" [disabled]="logoutInProgress">
      @if (logoutInProgress) {
        Signing out...
      } @else {
        Sign out
      }
    </button>
  </div>
</aside>
