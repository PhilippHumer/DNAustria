services:
  postgres:
    image: postgres:17
    container_name: dnaustria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnaustria
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dnaustria"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dnaustria-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pass
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  ldap:
    image: rroemhild/test-openldap:latest
    container_name: dnaustria-ldap
    restart: unless-stopped
    user: "0:0"
    ports:
      - "389:10389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://127.0.0.1:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  ldap-seed:
    image: rroemhild/test-openldap:latest
    container_name: dnaustria-ldap-seed
    restart: "no"
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        ldapadd -c -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -f /seed/01-users.ldif || true
        ldapsearch -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -b 'ou=people,dc=planetexpress,dc=com' '(uid=developer)' dn \
        | grep -q 'uid=developer,ou=people,dc=planetexpress,dc=com'
        ldapsearch -x -H ldap://ldap:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -b 'ou=people,dc=planetexpress,dc=com' '(uid=admin)' dn \
        | grep -q 'uid=admin,ou=people,dc=planetexpress,dc=com'
    volumes:
      - ../db/ldap-seed:/seed:ro

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: dnaustria-phpldapadmin
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      ldap:
        condition: service_started
      ldap-seed:
        condition: service_completed_successfully
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"

  backend:
    build:
      context: ../backend/DNAustria
      dockerfile: Dockerfile
    container_name: dnaustria-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ldap:
        condition: service_healthy
      ldap-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dnaustria;Username=admin;Password=pass
      Frontend__AllowedOrigins__0: http://localhost:4200
      Ldap__Host: ldap
      Ldap__Port: 10389
      Ldap__UseSsl: "false"
      Ldap__IgnoreCertificateErrors: "false"
      Ldap__SearchBase: ou=people,dc=planetexpress,dc=com
      Ldap__UserFilter: (uid={0})
      Ldap__UserDnPattern: ""
      Ldap__BindDn: cn=admin,dc=planetexpress,dc=com
      Ldap__BindPassword: GoodNewsEveryone
    ports:
      - "5001:5001"
    volumes:
      - backend_keys:/root/.aspnet/DataProtection-Keys

  frontend:
    build:
      context: ../frontend/DNAustria
      dockerfile: Dockerfile
    container_name: dnaustria-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:80"

volumes:
  backend_keys:
  pgdata:
  pgadmin_data:
